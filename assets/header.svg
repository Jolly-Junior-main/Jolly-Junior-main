<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Circuit Glow Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      .circuit-line {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .floating-node {
        animation: float 4s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M80 0 V320 M160 0 V320 M240 0 V320 M320 0 V320 M400 0 V320 M480 0 V320 M560 0 V320 M640 0 V320 M720 0 V320 M800 0 V320 M880 0 V320 M960 0 V320 M1040 0 V320 M1120 0 V320" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="220" r="160" fill="#9333ea" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Circuit Lines -->
  <g stroke="url(#cyan-glow)" stroke-width="2" fill="none" opacity="0.7">
    <path class="circuit-line" d="M 0,100 L 120,100 L 170,150 L 260,150 L 300,190 L 380,190" />
    <path class="circuit-line" d="M 0,220 L 140,220 L 190,170 L 280,170" />
    <path class="circuit-line" d="M 60,320 L 110,270 L 220,270 L 250,240" />
  </g>

  <!-- Left Circuit Nodes -->
  <g fill="#38bdf8" filter="url(#soft-glow)">
    <circle cx="170" cy="150" r="4" />
    <circle cx="260" cy="150" r="3" />
    <circle cx="300" cy="190" r="4" />
    <circle cx="380" cy="190" r="5" />
    <circle cx="190" cy="170" r="3" />
    <circle cx="280" cy="170" r="4" />
  </g>

  <!-- Right Circuit Lines & Nodes -->
  <g stroke="url(#purple-glow)" stroke-width="2" fill="none" opacity="0.7">
    <path class="circuit-line" d="M 1200,100 L 1080,100 L 1030,150 L 940,150 L 900,110 L 820,110" />
    <path class="circuit-line" d="M 1200,220 L 1060,220 L 1010,270 L 920,270" />
    <path class="circuit-line" d="M 1140,0 L 1090,50 L 980,50 L 950,80" />
  </g>

  <g fill="#c084fc" filter="url(#soft-glow)">
    <circle cx="1030" cy="150" r="4" />
    <circle cx="940" cy="150" r="3" />
    <circle cx="900" cy="110" r="4" />
    <circle cx="820" cy="110" r="5" />
    <circle cx="1010" cy="270" r="3" />
    <circle cx="920" cy="270" r="4" />
  </g>

  <!-- Center Content -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Mini Badge / Tag -->
    <g transform="translate(600, 75)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <circle cx="-75" cy="0" r="4" fill="#22c55e" filter="url(#soft-glow)"/>
      <text x="8" y="5" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">AVAILABLE FOR HIRE</text>
    </g>

    <!-- Main Title Heading -->
    <text x="600" y="150" font-size="44" font-weight="800" fill="url(#text-grad)" filter="url(#soft-glow)" letter-spacing="1.5">
      WELCOME TO MY PROFILE 👋
    </text>

    <!-- Subtitle / Role -->
    <text x="600" y="195" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="4">
      FULL STACK DEVELOPER  •  OPEN SOURCE  •  BUILDER
    </text>

    <!-- Code Badges / Highlights -->
    <g transform="translate(600, 245)" font-size="13" font-weight="600" fill="#e2e8f0">
      <!-- Tag 1 -->
      <g transform="translate(-210, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5">⚛️ React &amp; Next.js</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-70, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5">🔷 TypeScript</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(70, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5">🚀 Node &amp; Cloud</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(210, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5">🎨 UI / UX Design</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="318" x2="950" y2="318" stroke="url(#text-grad)" stroke-width="3" stroke-linecap="round" filter="url(#soft-glow)"/>
</svg>
